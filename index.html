<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SAP Material Master (Internal – Simple)</title>

  <!-- Bootstrap CSS (CDN) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
   >
  style.css
</head>
<body class="bg-light">

  <!-- Header -->
  <header class="border-bottom bg-white">
    <div class="container-fluid py-2 d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-2">
        <h4 class="mb-0 text-secondary fw-semibold">SAP Material Master</h4>
        <small class="text-muted">Internal Viewer</small>
      </div>

      <!-- Actions: Add + Search -->
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-success" data-bs-toggle="modal" data-bs-target="#addModal">
          + Add New Material
        </button>

        <form id="searchForm" class="d-flex" role="search" onsubmit="doSearch(event)">
          <input id="searchInput" class="form-control form-control-sm me-2" type="search"
                 placeholder="Search..." aria-label="Search">
          <button class="btn btn-sm btn-primary">Search</button>
        </form>
      </div>
    </div>
  </header>

  <!-- Body -->
  <main class="container-fluid py-2">
    <div class="row">
      <!-- Kolom kiri: daftar hasil -->
      <aside class="col-12 col-md-4 col-lg-3">
        <div class="card shadow-sm">
          <div class="card-header py-2">
            <div class="small fw-semibold text-secondary">RESULTS</div>
          </div>
          <div class="list-group list-group-flush small" id="resultList"></div>
          <div class="card-footer py-2">
            <nav>
              <ul class="pagination pagination-sm mb-0" id="pager"></ul>
            </nav>
          </div>
        </div>
      </aside>

      <!-- Kolom kanan: placeholder (detail pakai modal) -->
      <section class="col-12 col-md-8 col-lg-9 mt-3 mt-md-0">
        <div class="placeholder-area">
          <div class="placeholder-inner text-center text-muted">
            <div class="icon">🛈</div>
            <div>Pilih salah satu material pada daftar untuk melihat detailnya (tampil di modal).</div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Modal Detail Material -->
  <div class="modal fade" id="materialModal" tabindex="-1" aria-labelledby="materialModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h6 class="modal-title" id="materialModalLabel">Material Information</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <div class="row">
            <div class="col-12 col-lg-8"><dl class="row mb-0" id="detailFields"></dl></div>
            <div class="col-12 col-lg-4 d-flex align-items-start justify-content-center">
              <div class="placeholder-box text-center">
                <div class="icon">🖼️</div>
                <div class="caption">No Image Available</div>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer py-2">
          <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Add New Material -->
  <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <form class="modal-content" id="addForm" onsubmit="saveNewMaterial(event)">
        <div class="modal-header py-2">
          <h6 class="modal-title" id="addModalLabel">Add New Material</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body">
          <div class="row g-2">
            <div class="col-md-4">
              <label class="form-label small">Material No <span class="text-danger">*</span></label>
              <input class="form-control form-control-sm" id="f_material_no" required>
            </div>
            <div class="col-md-8">
              <label class="form-label small">Material Text <span class="text-danger">*</span></label>
              <input class="form-control form-control-sm" id="f_material_text" required>
            </div>

            <div class="col-md-4">
              <label class="form-label small">Storage Location</label>
              <input class="form-control form-control-sm" id="f_storage_location">
            </div>
            <div class="col-md-4">
              <label class="form-label small">Plant</label>
              <input class="form-control form-control-sm" id="f_plant">
            </div>
            <div class="col-md-4">
              <label class="form-label small">UoM</label>
              <input class="form-control form-control-sm" id="f_uom">
            </div>

            <div class="col-md-4">
              <label class="form-label small">Average Unit Price</label>
              <input type="number" step="0.01" class="form-control form-control-sm" id="f_avg_unit_price">
            </div>
            <div class="col-md-4">
              <label class="form-label small">Manufacturer</label>
              <input class="form-control form-control-sm" id="f_manufacturer">
            </div>
            <div class="col-md-4">
              <label class="form-label small">Stock Type</label>
              <input class="form-control form-control-sm" id="f_stock_type">
            </div>

            <div class="col-md-4">
              <label class="form-label small">Purchasing Group (Code)</label>
              <input class="form-control form-control-sm" id="f_purchasing_group">
            </div>
            <div class="col-md-4">
              <label class="form-label small">Purchasing Group Name</label>
              <input class="form-control form-control-sm" id="f_purchasing_group_name">
            </div>
            <div class="col-md-4">
              <label class="form-label small">Part Number</label>
              <input class="form-control form-control-sm" id="f_part_number">
            </div>

            <div class="col-md-6">
              <label class="form-label small">No PR</label>
              <input class="form-control form-control-sm" id="f_pr_no">
            </div>
            <div class="col-md-6">
              <label class="form-label small">No PO</label>
              <input class="form-control form-control-sm" id="f_po_no">
            </div>

            <div class="col-12">
              <label class="form-label small">PO Long Text</label>
              <textarea class="form-control form-control-sm" id="f_po_long_text" rows="3"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer py-2">
          <div class="me-auto small text-muted">Field bertanda * wajib diisi</div>
          <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button>
          <button class="btn btn-sm btn-success" type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS (CDN) - gunakan bundle agar modal bekerja (termasuk Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min
  <!-- Script lokal -->
  <script srcscript>
</body>
</html>
